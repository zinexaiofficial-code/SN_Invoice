# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR SN INVOICE
# File Path on VPS: /etc/nginx/sites-available/sn-invoice.conf
# ==============================================================================

# Upstream Next.js Container
upstream sn_invoice_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP — Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-custom-domain.com; # Replace with your domain (e.g. invoice.snadvertising.lk)

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-custom-domain.com; # Replace with your domain

    # SSL Certificate Configuration (Certbot will manage these)
    # ssl_certificate /etc/letsencrypt/live/your-custom-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-custom-domain.com/privkey.pem;

    # SSL Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload size for logos, signatures, and document attachments
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # PWA & Next.js Static Cache
    location /_next/static/ {
        proxy_pass http://sn_invoice_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service Worker & Manifest (Never aggressively cache SW)
    location ~* ^/(sw\.js|manifest\.json)$ {
        proxy_pass http://sn_invoice_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Application Proxy Pass
    location / {
        proxy_pass http://sn_invoice_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

