<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — SN Invoice</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 450px;
      width: 100%;
      border: 1px solid #E2E8F0;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #102A43;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748B;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      background-color: #102A43;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #243B53;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="SN Advertising" class="logo">
    <h1>You are currently offline</h1>
    <p>SN Invoice requires a secure connection to record and synchronize your clients, invoices, and payments safely.</p>
    <button class="btn" onclick="window.location.reload()">Check Connection &amp; Retry</button>
  </div>
</body>
</html>
